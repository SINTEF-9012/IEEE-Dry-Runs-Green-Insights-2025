apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: power-stress-multicore
  labels:
    pipeline: power_stress_multicore
    type: multi-job
    steps: "1"
spec:
  entrypoint: power-stress-fanout
  serviceAccountName: argo-workflow
  podGC:
    strategy: OnWorkflowCompletion
  arguments:
    parameters:
    # How long each stress pod runs for.
    - name: run-seconds
      value: "10800"
    # Number of pods to run concurrently. Each pod can land on a different
    # node, so this is the main lever for raising cluster-wide utilization
    # rather than just saturating a single node.
    - name: replicas
      value: "1"
    # CPU request/limit per pod. Keep this equal to cpu-workers-per-pod so
    # every core the pod is granted actually gets a busy worker.
    - name: cpu-per-pod
      value: "30"
    - name: cpu-workers-per-pod
      value: "30"
    # stress-ng CPU method. Unlike busybox_multicore's scalar-integer busy
    # loop (cheap, cache-resident, barely above idle power), matrixprod
    # drives the CPU's floating-point/vector (SIMD) units, which dominate a
    # modern CPU's *real* dynamic power range far more than raw "% busy"
    # scheduler occupancy does. Other power-hungry options: "fma", "vecmath".
    - name: cpu-method
      value: "matrixprod"
    # Memory stressor: number of workers and bytes allocated per worker.
    # Sized to exceed typical L2/L3 cache so reads/writes actually hit the
    # memory controller/DRAM (real, wall-visible power draw) instead of
    # staying resident in L1 like a tiny busy loop.
    - name: vm-workers-per-pod
      value: "2"
    - name: vm-bytes-per-worker
      value: "2G"
    - name: vm-method
      value: "all"
    # Optional disk I/O stressor (0 = disabled). Mirrors the disk-heavy
    # nature of real pipelines (e.g. samtools sort, GATK) that a pure
    # CPU/memory stressor still doesn't capture. Set to a positive value to
    # also recruit the storage subsystem.
    - name: hdd-workers-per-pod
      value: "1"
    - name: hdd-bytes-per-worker
      value: "2G"
    # Pod memory needs to comfortably fit
    # vm-workers-per-pod * vm-bytes-per-worker plus stress-ng/Alpine overhead.
    - name: memory-per-pod
      value: "2G"

  templates:
  - name: power-stress-fanout
    inputs:
      parameters:
      - name: run-seconds
        value: "{{workflow.parameters.run-seconds}}"
      - name: replicas
        value: "{{workflow.parameters.replicas}}"
    steps:
    - - name: power-stress
        template: power-stress
        arguments:
          parameters:
          - name: run-seconds
            value: "{{inputs.parameters.run-seconds}}"
        withSequence:
          count: "{{inputs.parameters.replicas}}"

  - name: power-stress
    inputs:
      parameters:
      - name: run-seconds
        value: "{{workflow.parameters.run-seconds}}"
    # resources.requests/limits are typed as Kubernetes resource.Quantity,
    # so they can't be templated directly with {{...}} (Argo/K8s validate
    # the raw string against the quantity regex before substitution runs).
    # podSpecPatch is a plain string field, so it IS substituted first.
    podSpecPatch: |
      containers:
      - name: main
        resources:
          requests:
            memory: "{{workflow.parameters.memory-per-pod}}"
            cpu: "{{workflow.parameters.cpu-per-pod}}"
          limits:
            memory: "{{workflow.parameters.memory-per-pod}}"
            cpu: "{{workflow.parameters.cpu-per-pod}}"
    container:
      image: narogus/power-stress-multicore:v1
      imagePullPolicy: IfNotPresent
      env:
      - name: RUN_SECONDS
        value: "{{inputs.parameters.run-seconds}}"
      - name: CPU_WORKERS
        value: "{{workflow.parameters.cpu-workers-per-pod}}"
      - name: CPU_METHOD
        value: "{{workflow.parameters.cpu-method}}"
      - name: VM_WORKERS
        value: "{{workflow.parameters.vm-workers-per-pod}}"
      - name: VM_BYTES
        value: "{{workflow.parameters.vm-bytes-per-worker}}"
      - name: VM_METHOD
        value: "{{workflow.parameters.vm-method}}"
      - name: HDD_WORKERS
        value: "{{workflow.parameters.hdd-workers-per-pod}}"
      - name: HDD_BYTES
        value: "{{workflow.parameters.hdd-bytes-per-worker}}"
